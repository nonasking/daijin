# daijin 우체국: 브레인과 같은 VPS 의 Mosquitto. voice/mosquitto/install.sh 가 /etc/mosquitto/conf.d/daijin.conf 로 넣는다.
# 왜 여기인가: 클라우드 브로커(EU)는 브레인↔브로커 홉이 턴마다 수백 ms 였고, 무료 플랜은 권한 하나에 토픽 필터 하나라
# 기기별로 토픽을 좁히기 어려웠다. 여기서는 acl 한 파일로 디바이스·노드·브레인을 나눈다 (docs/broker-credentials.md).

per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/daijin.passwd
acl_file /etc/mosquitto/daijin.acl

# 바깥: TLS 8883. 인증서는 Let's Encrypt (certbot 이 갱신하면 deploy hook 이 certs/ 로 복사한다).
# 펌웨어는 ISRG Root X1 을 이미 신뢰하므로(ca_cert.h) 호스트 이름만 바꾸면 된다.
listener 8883
certfile /etc/mosquitto/certs/fullchain.pem
keyfile  /etc/mosquitto/certs/privkey.pem
tls_version tlsv1.2

# 안: 같은 기계의 브레인·워처·initiative 는 평문 1883 (loopback 만). TLS 핸드셰이크와 암호화를 아낀다.
listener 1883 127.0.0.1

# 오디오 청크(QoS 0, 2KB)가 초당 수십 개 흐른다. 기본값은 넉넉하지만 메시지 크기 상한은 분명히 적어 둔다.
max_packet_size 65536
max_inflight_messages 40
max_queued_messages 2000

# persistence, persistence_location, log_dest 는 배포판의 /etc/mosquitto/mosquitto.conf 에 이미 있다. 두 번 적으면 뜨지 않는다.
connection_messages true
